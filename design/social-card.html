<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Обложка курса для ссылок</title>
  <link rel="stylesheet" href="../css/fonts.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#111;font-family:Onest,Arial,sans-serif}
    .card{width:1200px;height:630px;position:relative;padding:48px 54px;overflow:hidden;background:#fff}
    .identity{display:flex;align-items:center;gap:13px;font-size:14px;line-height:1.4}
    .identity img{width:31px;height:31px}
    .identity small{display:block;color:#807061;font:9px/1.8 PlexMono,Consolas,monospace}
    .eyebrow{font:10px/1.5 PlexMono,Consolas,monospace;text-transform:uppercase;letter-spacing:.07em;color:#82634b;margin:49px 0 20px}
    h1{font-size:65px;line-height:1.04;letter-spacing:-.055em;font-weight:400;margin:0;max-width:745px}
    .subtitle{font-size:35px;line-height:1.2;letter-spacing:-.045em;color:#78695d;margin:24px 0 0}
    .experience{font-size:15px;color:#65594f;margin:23px 0 0;line-height:1.6}
    .portrait{position:absolute;right:54px;top:50px;width:300px;height:452px;border-radius:16px;overflow:hidden;background:#f7f4f1}
    .portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 17%;display:block}
    .details{position:absolute;bottom:46px;left:54px;right:54px;border-top:1px solid #e4d9ce;padding-top:25px;display:flex;justify-content:space-between;align-items:center;gap:30px}
    .start{display:inline-flex;align-items:center;gap:17px;font-size:15px;color:#3b281d}
    .start strong{font-size:23px;font-weight:400;letter-spacing:-.035em}
    .format{font:11px/1.8 PlexMono,Consolas,monospace;color:#78695d;letter-spacing:.02em}
  </style>
</head>
<body>
  <main class="card" aria-label="Обложка курса">
    <div class="identity"><img src="../images/course-mark.svg" alt=""><span>Евгений Коцур<small>ПРАКТИКА ПРОЕКТИРОВАНИЯ С ИИ</small></span></div>
    <p class="eyebrow">Практический онлайн-курс</p>
    <h1>Нейросети<br>для проектирования</h1>
    <p class="subtitle">От чата до ассистента.</p>
    <p class="experience">20 лет в промышленном<br>и гражданском проектировании</p>
    <div class="portrait"><img src="../images/author-portrait-600.webp" width="600" height="900" alt="Евгений Коцур"></div>
    <div class="details"><span class="start">Старт <strong>28 ноября 2026</strong></span><span class="format">5 недель · 15 часов · Телемост<br>Проверка ДЗ каждого участника</span></div>
  </main>
</body>
</html>
